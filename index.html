<!doctype html>
<html lang="es" data-tema="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>befit</title>
    <meta name="description" content="Ejercicios de gimnasio explicados con un maniquí 3D." />

    <!--
      Instalable: el manifiesto y los iconos. iOS no lee los iconos del manifiesto, de ahí el
      apple-touch-icon en PNG; y theme-color tiñe la barra del navegador con el fondo de la app.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="theme-color" content="#0B0B0F" />

    <!--
      Se precarga solo la tipografía de interfaz. La de los titulares llega un instante después y el
      texto ya se está leyendo con la de respaldo: precargarlo todo compite con lo que de verdad
      bloquea la primera pantalla.
    -->
    <link rel="preload" href="/fuentes/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Tema e idioma se resuelven ANTES de pintar, en un script síncrono. El tema, porque si no se ve
      el destello blanco al entrar en un sitio oscuro. El idioma, porque `lang` manda en dos cosas a
      la vez: qué ui.json carga la app y qué lee un lector de pantalla; resolverlo después obligaría
      a repintar la página entera y dejaría el idioma del documento mintiendo mientras tanto.
    -->
    <script>
      (() => {
        const guardado = localStorage.getItem('tema');
        // Sin preferencia guardada, OSCURO. No es el gusto del sistema: es el tema en el que está
        // pensada la app —fondo casi negro y un solo acento—, y el claro es la alternativa.
        const oscuro = guardado ? guardado === 'oscuro' : true;
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';

        const idiomas = ['es', 'en'];
        const pedido = localStorage.getItem('idioma') ?? navigator.language.slice(0, 2);
        document.documentElement.lang = idiomas.includes(pedido) ? pedido : 'es';
      })();
    </script>
  </head>
  <body>
    <!--
      La portada va escrita aquí y la app la sustituye al arrancar. No es duplicar contenido: es lo
      único que el navegador puede pintar antes de descargar y ejecutar el JavaScript. Con el
      contenedor vacío, el primer texto tardaba 2,7 s en el móvil de gama baja.
    -->
    <div id="cabecera"></div>
    <main id="sitio">
      <div class="portada">
        <h1>La técnica primero. El peso, después.</h1>
        <p hidden></p>
      </div>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
