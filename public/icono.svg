<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Icono de la app instalada: una barra con discos sobre el fondo oscuro de la app y en su único
    acento. Todo el dibujo cabe en el 60 % central, que es la zona segura de un icono «maskable»:
    Android lo recorta en círculo, en gota o en cuadrado según el móvil, y fuera de esa zona se come
    los discos.
  -->
  <rect width="512" height="512" fill="#0B0B0F"/>
  <g fill="#FF7A1A">
    <rect x="120" y="244" width="272" height="24" rx="6"/>
    <rect x="150" y="186" width="30" height="140" rx="8"/>
    <rect x="186" y="206" width="24" height="100" rx="7"/>
    <rect x="332" y="186" width="30" height="140" rx="8"/>
    <rect x="302" y="206" width="24" height="100" rx="7"/>
  </g>
</svg>
